services:
  db-bible:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./db-entrypoint:/docker-entrypoint-initdb.d
    ports:
      - 55434:5432
    networks:
      - bible-network
      - cloudbeaver
  app:
    container_name: "biblia_filipelopesme_fastapi"
    env_file:
      - .env
    build: .
    restart: always
    volumes:
      - .:/src
      - ./data/biblia:/initial_data
    ports:
      - ${APP_PORT}:8000
    depends_on:
      - db-bible
      - llama-cpp
    networks:
      - bible-network
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ./data/models:/models
    command:
      - "--model"
      - "/models/Qwen3-Embedding-4B-Q8_0.gguf"
      - "--embedding"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    networks:
      - bible-network

networks:
  bible-network:
    name: "bible-net"
    driver: bridge
  cloudbeaver:
    external: true
    
