[project]
name = "biblia-filipelopes-me"
version = "0.5.0"
dependencies = [
    "uvicorn[standard]==0.28.0",
    "fastapi==0.110.0",
    "sqlmodel==0.0.16",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.25.2",
    "python-dotenv==1.0.1",
    "pgvector==0.2.5",
]

[dependency-groups]
dev = [
    "numpy",
    "transformers",
    "tqdm",
    "torch",
    "pytest",
    "pytest-cov",
    "black",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=html --cov-report=term"
testpaths = ["tests"]
markers = [
    "unit: marca testes unitários",
    "integration: marca testes de integração", 
    "slow: marca testes que demoram mais para executar"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
